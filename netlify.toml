[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/admin-leads"
  to = "/.netlify/functions/admin-leads"
  status = 200

# Force-redirect Pipeline HTML files away from the OS domain
[[redirects]]
  from = "/funnel.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 301
  force = true

# Precision Pipeline funnel still accessible at /pipeline
[[redirects]]
  from = "/pipeline"
  to = "/funnel.html"
  status = 200

[[redirects]]
  from = "/pipeline/*"
  to = "/funnel.html"
  status = 200

# SPA catch-all — everything else serves the Precision OS shell
[[redirects]]
  from = "/*"
  to = "/precision-os.html"
  status = 200
