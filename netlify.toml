[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/admin-leads"
  to = "/.netlify/functions/admin-leads"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200

[[redirects]]
  from = "/api/workspaces"
  to = "/.netlify/functions/workspaces"
  status = 200

# Precision Pipeline funnel accessible at /pipeline
[[redirects]]
  from = "/pipeline"
  to = "/funnel.html"
  status = 200

[[redirects]]
  from = "/pipeline/*"
  to = "/funnel.html"
  status = 200

# SPA catch-all — everything else serves the Precision OS shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
