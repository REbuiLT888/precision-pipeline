[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/admin-leads"
  to = "/.netlify/functions/admin-leads"
  status = 200

# SPA catch-all — serves funnel.html for all routes so the JS router handles them
[[redirects]]
  from = "/*"
  to = "/funnel.html"
  status = 200
